<!DOCTYPE HTML>
<html lang="en"   xmlns:th="http://www.thymeleaf.org">
				  
<head th:replace="plantilla/template :: head">
		<meta charset="ISO-8859-1">
		<title>Estudios Registro</title>		
</head>
<body>								  
	<header th:replace="plantilla/template :: header"></header>
	<div class="container">
		<div class="card bg-ligth">
			<div class="card-header bg-dark text-white" th:text="${titulo}" ></div>
				<div class="card-header">
					      			   								                       
					<form th:action="@{/views/estudios/save}" th:object="${estudio}" method="post">
					  <div class="form-group col-md-6">  
						<input type="hidden" th:field="*{idestudio}">                      
					    <label for="estudio" class="form-label">Estudio</label>
						<input type="text" th:field="*{estudio}" class="form-control" id="estudio" aria-describedby="estudio" placeholder="Estudio">						  
					    <small class="form-text text-danger" th:if="${#fields.hasErrors('estudio')}" th:errors="*{estudio}"></small>
					  </div>

						<div class="form-group col-md-6">
						  	<label for="id" class="form-label">Unidad de Medida</label>
							<input type="text" th:field="*{unidad}" class="form-control" id="unidad" aria-describedby="unidad" placeholder="Unidad">						  
						    <small class="form-text text-danger" th:if="${#fields.hasErrors('unidad')}" th:errors="*{unidad}"></small>

						  	<label for="id" class="form-label">Valor de Referencia</label>
							<input type="text" th:field="*{valor}" class="form-control" id="valor" aria-describedby="valor" placeholder="Valor">						  
						    <small class="form-text text-danger" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></small>
						</div>
						
					  <div class="card-footer col-md-6 bg-dark">
					  	 <button type="submit" class="btn btn-primary" title="Guardar estudio" th:text="#{PacientesForm.Guardar}"></button>
					  </div>

					</form>
				</div>
			</div>		
	</div>

	<footer th:replace="plantilla/template :: footer"></footer>
</body>
</html>
